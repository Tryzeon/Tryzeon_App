name: Beta Build - iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version for this TestFlight train, for example 1.2.0
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-and-deploy-ios-beta:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: false

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "REVENUE_CAT_API_KEY=${{ secrets.REVENUE_CAT_APPLE_API_KEY }}" >> .env
          echo "R2_PUBLIC_IMAGES_BASE_URL=${{ secrets.R2_PUBLIC_IMAGES_BASE_URL }}" >> .env
          echo "CHOTTULINK_API_KEY=${{ secrets.CHOTTULINK_API_KEY }}" >> .env

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Install Bundle
        run: |
          cd ios
          bundle install

      - name: Setup SSH for match
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MATCH_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install FlutterFire CLI
        run: dart pub global activate flutterfire_cli

      - name: Configure Xcode project (Flutter)
        run: flutter build ios --release --config-only --no-codesign

      - name: Build and deploy to TestFlight
        run: |
          cd ios
          bundle exec fastlane beta
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
