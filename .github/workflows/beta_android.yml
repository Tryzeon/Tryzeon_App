name: Beta Build - Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version for this testing build, for example 1.2.0
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-and-deploy-android-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false   # keep Flutter/Java tool cache
          android: false      # Android SDK is needed to build the app bundle
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false  # 7.8GB runner needs the swap headroom for R8; disk is not the constraint

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Gradle cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/build.gradle.kts', 'android/app/build.gradle.kts', 'android/settings.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: android

      - name: Install Fastlane
        run: |
          cd android
          bundle install

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "REVENUE_CAT_API_KEY=${{ secrets.REVENUE_CAT_GOOGLE_API_KEY }}" >> .env
          echo "R2_PUBLIC_IMAGES_BASE_URL=${{ secrets.R2_PUBLIC_IMAGES_BASE_URL }}" >> .env

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure Keystore
        run: |
          echo "${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.PLAYSTORE_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.PLAYSTORE_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.PLAYSTORE_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Deploy to Play internal testing
        run: |
          cd android
          bundle exec fastlane beta
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PLAYSTORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
