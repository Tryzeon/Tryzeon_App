name: CI - LIFF Web

on:
  push:
    branches: [main]
    paths:
      - 'liff-web/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'liff-web/**'
      - '.github/workflows/ci-web.yml'
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: liff-web

jobs:
  build:
    name: Build & Test LIFF Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: liff-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same `tsc -b && vite build` Vercel runs, so a bundling failure is caught
      # here rather than on deploy.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
